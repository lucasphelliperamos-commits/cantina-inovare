<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel do Administrador - Cantina Inovare</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            color: #1769c2;
            text-align: center;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .atualizar {
            background: #1769c2;
            color: white;
        }

        .sair {
            background: #e53935;
            color: white;
        }

        .mensagem {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .erro {
            display: block;
            background: #ffdede;
            color: #b00000;
        }

        .sucesso {
            display: block;
            background: #d9f8df;
            color: #08751d;
        }

        .resumo {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .card span {
            display: block;
            color: #666;
            margin-bottom: 8px;
        }

        .card strong {
            font-size: 25px;
            color: #1769c2;
        }

        .tabela-container {
            background: white;
            border-radius: 12px;
            padding: 15px;
            overflow-x: auto;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #1769c2;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f9ff;
        }

        .status-select {
            padding: 7px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-weight: bold;
        }

        .status-pendente {
            color: #d97706;
            border-color: #d97706;
        }

        .status-pago {
            color: #16803c;
            border-color: #16803c;
        }

        .status-cancelado {
            color: #d00000;
            border-color: #d00000;
        }

        .pagamento-confirmado {
            color: #16803c;
            font-weight: bold;
        }

        .pagamento-pendente {
            color: #d97706;
            font-weight: bold;
        }

        .pagamento-cancelado {
            color: #d00000;
            font-weight: bold;
        }

        .sem-pedidos {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        @media (max-width: 800px) {

            .resumo {
                grid-template-columns: repeat(2, 1fr);
            }

            .topo {
                flex-direction: column;
                align-items: flex-start;
            }

        }

        @media (max-width: 500px) {

            .resumo {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>🔐 Painel do Administrador</h1>

    <div class="topo">

        <strong>📋 Pedidos da Cantina</strong>

        <div>

            <button
                class="atualizar"
                onclick="carregarPedidos()">
                🔄 Atualizar
            </button>

            <button
                class="sair"
                onclick="sair()">
                🚪 Sair
            </button>

        </div>

    </div>


    <div id="mensagem" class="mensagem"></div>


    <!-- RESUMO -->

    <div class="resumo">

        <div class="card">

            <span>Pedidos</span>

            <strong id="totalPedidos">
                0
            </strong>

        </div>


        <div class="card">

            <span>Total arrecadado</span>

            <strong id="totalArrecadado">
                R$ 0,00
            </strong>

        </div>


        <div class="card">

            <span>Pendentes</span>

            <strong id="totalPendentes">
                0
            </strong>

        </div>


        <div class="card">

            <span>Pagos</span>

            <strong id="totalPagos">
                0
            </strong>

        </div>

    </div>


    <!-- PEDIDOS -->

    <h2>Pedidos recebidos</h2>


    <div class="tabela-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Aluno</th>

                    <th>Turma</th>

                    <th>Itens</th>

                    <th>Total</th>

                    <th>Pagamento</th>

                    <th>Status</th>

                    <th>Data</th>

                </tr>

            </thead>


            <tbody id="listaPedidos">

                <tr>

                    <td
                        colspan="8"
                        class="sem-pedidos">

                        ⏳ Carregando pedidos...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

// ==========================================
// CONFIGURAÇÃO SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://duvwemmqgdwlastmfegh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vlsLJ9-0Jrij35lSz3cigQ_entN7J8c";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==========================================
// MOSTRAR MENSAGEM
// ==========================================

function mostrarMensagem(texto, tipo) {

    const mensagem =
        document.getElementById("mensagem");

    mensagem.textContent = texto;

    mensagem.className =
        "mensagem " + tipo;

}


// ==========================================
// CARREGAR PEDIDOS
// ==========================================

async function carregarPedidos() {

    const lista =
        document.getElementById("listaPedidos");


    lista.innerHTML = `
        <tr>
            <td colspan="8" class="sem-pedidos">
                ⏳ Carregando pedidos...
            </td>
        </tr>
    `;


    const { data, error } =
        await supabaseClient
            .from("pedidos")
            .select("*")
            .order("criado_em", {
                ascending: false
            });


    if (error) {

        console.error(
            "ERRO SUPABASE:",
            error
        );


        mostrarMensagem(
            "❌ Erro ao carregar pedidos: " +
            error.message,
            "erro"
        );


        lista.innerHTML = `
            <tr>
                <td colspan="8" class="sem-pedidos">
                    ❌ Não foi possível carregar os pedidos.
                </td>
            </tr>
        `;

        return;
    }


    const pedidos =
        data || [];


    // ==========================================
    // ATUALIZAR RESUMO
    // ==========================================

    document.getElementById(
        "totalPedidos"
    ).textContent =
        pedidos.length;


    let totalArrecadado = 0;

    let pendentes = 0;

    let pagos = 0;


    pedidos.forEach(pedido => {

        const status =
            pedido.status || "Pendente";


        if (status === "Pago") {

            pagos++;

            totalArrecadado +=
                Number(pedido.total || 0);

        }


        if (status === "Pendente") {

            pendentes++;

        }

    });


    document.getElementById(
        "totalArrecadado"
    ).textContent =
        "R$ " +
        totalArrecadado
            .toFixed(2)
            .replace(".", ",");


    document.getElementById(
        "totalPendentes"
    ).textContent =
        pendentes;


    document.getElementById(
        "totalPagos"
    ).textContent =
        pagos;


    // ==========================================
    // NENHUM PEDIDO
    // ==========================================

    if (pedidos.length === 0) {

        lista.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="sem-pedidos">

                    📭 Nenhum pedido encontrado.

                </td>
            </tr>
        `;

        return;
    }


    // ==========================================
    // MOSTRAR PEDIDOS
    // ==========================================

    lista.innerHTML = "";


    pedidos.forEach(pedido => {

        // ------------------------------
        // ITENS
        // ------------------------------

        let itensTexto = "";


        if (Array.isArray(pedido.itens)) {

            itensTexto =
                pedido.itens
                    .map(item =>
                        `${item.quantidade}x ${item.produto}`
                    )
                    .join(", ");

        } else {

            itensTexto =
                pedido.itens || "";

        }


        // ------------------------------
        // DATA
        // ------------------------------

        let dataFormatada = "";


        if (pedido.criado_em) {

            dataFormatada =
                new Date(
                    pedido.criado_em
                ).toLocaleString(
                    "pt-BR"
                );

        }


        // ------------------------------
        // STATUS
        // ------------------------------

        const status =
            pedido.status || "Pendente";


        let classeStatus =
            "status-pendente";


        if (status === "Pago") {

            classeStatus =
                "status-pago";

        }


        if (status === "Cancelado") {

            classeStatus =
                "status-cancelado";

        }


        // ------------------------------
        // PAGAMENTO
        // ------------------------------

        let pagamentoTexto = "";

        let classePagamento = "";


        if (status === "Pago") {

            pagamentoTexto =
                "✅ Pagamento confirmado";

            classePagamento =
                "pagamento-confirmado";

        }

        else if (status === "Cancelado") {

            pagamentoTexto =
                "❌ Pedido cancelado";

            classePagamento =
                "pagamento-cancelado";

        }

        else {

            pagamentoTexto =
                pedido.pagamento ||
                "Aguardando pagamento";

            classePagamento =
                "pagamento-pendente";

        }


        // ------------------------------
        // CRIAR LINHA
        // ------------------------------

        const linha =
            document.createElement("tr");


        linha.innerHTML = `

            <td>
                ${pedido.id}
            </td>


            <td>

                <strong>
                    ${pedido.nome || ""}
                </strong>

            </td>


            <td>
                ${pedido.turma || ""}
            </td>


            <td>
                ${itensTexto}
            </td>


            <td>

                <strong>

                    R$
                    ${Number(
                        pedido.total || 0
                    )
                    .toFixed(2)
                    .replace(".", ",")}

                </strong>

            </td>


            <td class="${classePagamento}">

                ${pagamentoTexto}

            </td>


            <td>

                <select
                    class="status-select ${classeStatus}"
                    onchange="alterarStatus(${pedido.id}, this.value)"
                >

                    <option
                        value="Pendente"
                        ${status === "Pendente"
                            ? "selected"
                            : ""}>

                        Pendente

                    </option>


                    <option
                        value="Pago"
                        ${status === "Pago"
                            ? "selected"
                            : ""}>

                        Pago

                    </option>


                    <option
                        value="Cancelado"
                        ${status === "Cancelado"
                            ? "selected"
                            : ""}>

                        Cancelado

                    </option>

                </select>

            </td>


            <td>
                ${dataFormatada}
            </td>

        `;


        lista.appendChild(linha);

    });

}


// ==========================================
// ALTERAR STATUS
// ==========================================

async function alterarStatus(
    id,
    novoStatus
) {

    const { error } =
        await supabaseClient
            .from("pedidos")
            .update({
                status: novoStatus
            })
            .eq("id", id);


    if (error) {

        console.error(error);


        mostrarMensagem(
            "❌ Não foi possível alterar o status: " +
            error.message,
            "erro"
        );


        return;
    }


    mostrarMensagem(
        "✅ Status atualizado com sucesso!",
        "sucesso"
    );


    // Atualiza tabela e resumo

    await carregarPedidos();

}


// ==========================================
// SAIR
// ==========================================

function sair() {

    window.location.href =
        "index.html";

}


// ==========================================
// INICIAR
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        carregarPedidos();

    }
);

</script>

</body>

</html>
