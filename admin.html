<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Painel do Administrador - Cantina Inovare</title>

    <!-- SUPABASE CARREGADO ANTES DO NOSSO JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            color: #1769c2;
            text-align: center;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .atualizar {
            background: #1769c2;
            color: white;
        }

        .sair {
            background: #e53935;
            color: white;
        }

        .mensagem {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .erro {
            display: block;
            background: #ffdede;
            color: #b00000;
        }

        .sucesso {
            display: block;
            background: #d9f8df;
            color: #08751d;
        }

        .tabela-container {
            background: white;
            border-radius: 12px;
            padding: 15px;
            overflow-x: auto;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #1769c2;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f9ff;
        }

        .status-select {
            padding: 7px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-weight: bold;
        }

        .sem-pedidos {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .resumo {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .card-titulo {
            color: #666;
            margin-bottom: 10px;
        }

        .card-valor {
            font-size: 25px;
            font-weight: bold;
            color: #1769c2;
        }

        @media (max-width: 700px) {

            .resumo {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>🔐 Painel do Administrador</h1>

    <div class="topo">

        <strong>
            📋 Pedidos da Cantina
        </strong>

        <div>

            <button
                class="atualizar"
                onclick="carregarPedidos()">

                🔄 Atualizar

            </button>

            <button
                class="sair"
                onclick="sair()">

                🚪 Sair

            </button>

        </div>

    </div>


    <!-- RESUMO -->

    <div class="resumo">

        <div class="card">

            <div class="card-titulo">
                Pedidos
            </div>

            <div
                class="card-valor"
                id="totalPedidos">

                0

            </div>

        </div>


        <div class="card">

            <div class="card-titulo">
                Total arrecadado
            </div>

            <div
                class="card-valor"
                id="totalArrecadado">

                R$ 0,00

            </div>

        </div>


        <div class="card">

            <div class="card-titulo">
                Pendentes
            </div>

            <div
                class="card-valor"
                id="totalPendentes">

                0

            </div>

        </div>


        <div class="card">

            <div class="card-titulo">
                Pagos
            </div>

            <div
                class="card-valor"
                id="totalPagos">

                0

            </div>

        </div>

    </div>


    <div
        id="mensagem"
        class="mensagem">
    </div>


    <div class="tabela-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Aluno</th>

                    <th>Turma</th>

                    <th>Itens</th>

                    <th>Total</th>

                    <th>Pagamento</th>

                    <th>Status</th>

                    <th>Data</th>

                </tr>

            </thead>


            <tbody id="listaPedidos">

                <tr>

                    <td
                        colspan="8"
                        class="sem-pedidos">

                        ⏳ Carregando pedidos...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>


// ==========================================
// CONFIGURAÇÃO DO SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://duvwemmqgdwlastmfegh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vlsLJ9-0Jrij35lSz3cigQ_entN7J8c";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==========================================
// MOSTRAR MENSAGEM
// ==========================================

function mostrarMensagem(texto, tipo) {

    const mensagem =
        document.getElementById("mensagem");

    mensagem.textContent = texto;

    mensagem.className =
        "mensagem " + tipo;

}


// ==========================================
// CARREGAR PEDIDOS
// ==========================================

async function carregarPedidos() {

    const lista =
        document.getElementById(
            "listaPedidos"
        );


    lista.innerHTML = `
        <tr>
            <td colspan="8"
                class="sem-pedidos">
                ⏳ Carregando pedidos...
            </td>
        </tr>
    `;


    const resultado =
        await supabaseClient
            .from("pedidos")
            .select("*")
            .order(
                "criado_em",
                {
                    ascending: false
                }
            );


    const data =
        resultado.data;

    const error =
        resultado.error;


    // ==========================================
    // ERRO
    // ==========================================

    if (error) {

        console.error(
            "Erro Supabase:",
            error
        );


        mostrarMensagem(
            "❌ Erro ao carregar pedidos: " +
            error.message,
            "erro"
        );


        lista.innerHTML = `
            <tr>
                <td colspan="8"
                    class="sem-pedidos">
                    ❌ Não foi possível carregar
                    os pedidos.
                </td>
            </tr>
        `;


        return;
    }


    // ==========================================
    // ATUALIZAR RESUMO
    // ==========================================

    const totalPedidos =
        data ? data.length : 0;


    let totalArrecadado = 0;

    let totalPendentes = 0;

    let totalPagos = 0;


    if (data) {

        data.forEach(pedido => {

            const total =
                Number(
                    pedido.total || 0
                );


            totalArrecadado += total;


            const status =
                pedido.status ||
                "Pendente";


            if (
                status === "Pendente"
            ) {

                totalPendentes++;

            }


            if (
                status === "Pago"
            ) {

                totalPagos++;

            }

        });

    }


    document.getElementById(
        "totalPedidos"
    ).textContent =
        totalPedidos;


    document.getElementById(
        "totalArrecadado"
    ).textContent =
        "R$ " +
        totalArrecadado
            .toFixed(2)
            .replace(".", ",");


    document.getElementById(
        "totalPendentes"
    ).textContent =
        totalPendentes;


    document.getElementById(
        "totalPagos"
    ).textContent =
        totalPagos;


    // ==========================================
    // NENHUM PEDIDO
    // ==========================================

    if (
        !data ||
        data.length === 0
    ) {

        lista.innerHTML = `
            <tr>
                <td colspan="8"
                    class="sem-pedidos">

                    📭 Nenhum pedido encontrado.

                </td>
            </tr>
        `;

        return;
    }


    // ==========================================
    // LIMPAR LISTA
    // ==========================================

    lista.innerHTML = "";


    // ==========================================
    // MOSTRAR PEDIDOS
    // ==========================================

    data.forEach(pedido => {

        let itensTexto = "";


        // --------------------------------------
        // ITENS
        // --------------------------------------

        if (
            Array.isArray(
                pedido.itens
            )
        ) {

            itensTexto =
                pedido.itens
                    .map(item => {

                        return (
                            item.quantidade +
                            "x " +
                            item.produto
                        );

                    })
                    .join(", ");

        } else {

            itensTexto =
                pedido.itens || "";

        }


        // --------------------------------------
        // DATA
        // --------------------------------------

        let dataFormatada = "";


        if (
            pedido.criado_em
        ) {

            dataFormatada =
                new Date(
                    pedido.criado_em
                ).toLocaleString(
                    "pt-BR"
                );

        }


        // --------------------------------------
        // STATUS
        // --------------------------------------

        const status =
            pedido.status ||
            "Pendente";


        // --------------------------------------
        // LINHA
        // --------------------------------------

        const linha =
            document.createElement(
                "tr"
            );


        linha.innerHTML = `

            <td>
                ${pedido.id}
            </td>

            <td>
                <strong>
                    ${pedido.nome || ""}
                </strong>
            </td>

            <td>
                ${pedido.turma || ""}
            </td>

            <td>
                ${itensTexto}
            </td>

            <td>
                <strong>
                    R$
                    ${Number(
                        pedido.total || 0
                    )
                    .toFixed(2)
                    .replace(".", ",")}
                </strong>
            </td>

            <td>
                ${
                    pedido.pagamento ||
                    "Aguardando pagamento"
                }
            </td>

            <td>

                <select
                    class="status-select"
                    onchange="
                        alterarStatus(
                            ${pedido.id},
                            this.value
                        )
                    "
                >

                    <option
                        value="Pendente"
                        ${
                            status ===
                            "Pendente"
                            ? "selected"
                            : ""
                        }>

                        🟠 Pendente

                    </option>


                    <option
                        value="Pago"
                        ${
                            status ===
                            "Pago"
                            ? "selected"
                            : ""
                        }>

                        🟢 Pago

                    </option>


                    <option
                        value="Cancelado"
                        ${
                            status ===
                            "Cancelado"
                            ? "selected"
                            : ""
                        }>

                        🔴 Cancelado

                    </option>

                </select>

            </td>

            <td>
                ${dataFormatada}
            </td>

        `;


        lista.appendChild(
            linha
        );

    });

}


// ==========================================
// ALTERAR STATUS
// ==========================================

async function alterarStatus(
    id,
    novoStatus
) {

    const resultado =
        await supabaseClient
            .from("pedidos")
            .update({
                status: novoStatus
            })
            .eq(
                "id",
                id
            );


    const error =
        resultado.error;


    if (error) {

        console.error(
            error
        );


        mostrarMensagem(
            "❌ Não foi possível alterar " +
            "o status: " +
            error.message,
            "erro"
        );


        return;
    }


    mostrarMensagem(
        "✅ Status atualizado com sucesso!",
        "sucesso"
    );


    // Atualiza os números do painel
    carregarPedidos();

}


// ==========================================
// SAIR
// ==========================================

function sair() {

    window.location.href =
        "index.html";

}


// ==========================================
// INICIAR
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        carregarPedidos();

    }
);


</script>

</body>

</html>
